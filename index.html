<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account - Crazy Time</title>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #00c9ff, #92fe9d);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      max-width: 900px;
      overflow: hidden;
      width: 100%;
    }

    .left {
      background: url('https://source.unsplash.com/500x600/?technology,fun') no-repeat center center/cover;
      flex: 1;
      display: none;
    }

    .right {
      flex: 1;
      padding: 40px;
    }

    .right h1 { text-align: center; margin-bottom: 30px; color: #333; }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      padding: 10px 12px;
      border-radius: 10px;
      background-color: #fff;
    }

    .input-group i.fas {
      color: #888;
      margin-right: 10px;
      font-size: 16px;
    }

    .input-group input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      background-color: transparent;
    }

    .input-group .toggle {
      color: #888;
      cursor: pointer;
      font-size: 16px;
      margin-left: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(to right, #00c9ff, #92fe9d);
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: linear-gradient(to right, #43e97b, #38f9d7);
    }

    .error-message {
      color: red;
      font-size: 14px;
      margin-bottom: 15px;
      display: none;
    }

    @media (min-width: 768px) {
      .left { display: block; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="left"></div>
    <div class="right">
      <h1>Welcome to Crazy Time 🎉</h1>

      <form onsubmit="return validateForm()">
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" id="first_name" name="first_name" placeholder="First Name" required />
        </div>

        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" id="last_name" name="last_name" placeholder="Last Name" required />
        </div>

        <div class="input-group">
          <i class="fas fa-phone"></i>
          <input type="tel" id="phone" name="phone" placeholder="Phone number (e.g. +1234567890)" required />
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" name="password" placeholder="Password" required />
          <i class="fas fa-eye toggle" onclick="togglePassword('password', this)"></i>
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required />
          <i class="fas fa-eye toggle" onclick="togglePassword('confirm_password', this)"></i>
        </div>

        <div id="error-message" class="error-message"></div>

        <button type="submit">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>
    </div>
  </div>

  <script>
    // Toggle password visibility
    function togglePassword(inputId, iconElement) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      iconElement.classList.toggle('fa-eye');
      iconElement.classList.toggle('fa-eye-slash');
    }

    // Form validation
    function validateForm() {
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const errorMessage = document.getElementById('error-message');

      errorMessage.style.display = 'none';
      errorMessage.innerText = '';

      // Validate phone number format (+ and 9-15 digits)
      const phoneRegex = /^\+\d{9,15}$/;
      if (!phoneRegex.test(phone)) {
        errorMessage.innerText = 'Please enter a valid phone number starting with + and digits only.';
        errorMessage.style.display = 'block';
        return false;
      }

      // Strong password check (min 8 chars, uppercase, lowercase, number, special char)
      const strong = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
      if (!strong.test(password)) {
        errorMessage.innerText = 'Password must include uppercase, lowercase, number, symbol and be at least 8 characters long.';
        errorMessage.style.display = 'block';
        return false;
      }

      // Password match check
      if (password !== confirmPassword) {
        errorMessage.innerText = 'Passwords do not match.';
        errorMessage.style.display = 'block';
        return false;
      }

      // ✅ Passed all validation — redirect
      window.location.href = 'https://hobbies-flame.vercel.app/';
      return false; // Prevent default form submit
    }
  </script>
</body>
</html>
