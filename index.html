<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account - Crazy Time</title>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #00c9ff, #92fe9d);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      max-width: 900px;
      overflow: hidden;
      width: 100%;
    }
    .left {
      background: url('https://source.unsplash.com/500x600/?technology,fun') no-repeat center center/cover;
      flex: 1;
      display: none;
    }
    .right {
      flex: 1;
      padding: 40px;
    }
    .right h1 { text-align: center; margin-bottom: 30px; color: #333; }
    .input-group { position: relative; margin-bottom: 20px; }
    .input-group input {
      width: 100%;
      padding: 12px 40px 12px 40px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }
    .input-group i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
    }
    .input-group .toggle { right: 10px; left: auto; cursor: pointer; }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(to right, #00c9ff, #92fe9d);
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: linear-gradient(to right, #43e97b, #38f9d7);
    }
    @media (min-width: 768px) {
      .left { display: block; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left"></div>
    <div class="right">
      <h1>Welcome to Crazy Time 🎉</h1>
      <form action="index.html" method="POST" onsubmit="return validatePassword()">
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" name="first_name" placeholder="First Name" required />
        </div>
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" name="last_name" placeholder="Last Name" required />
        </div>
        
<!-- Add this in your <head> for Font Awesome icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<style>
  .input-group {
    position: relative;
    display: flex;
    align-items: center;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    padding: 10px 12px;
    border-radius: 6px;
    background-color: #fff;
  }

  .input-group i.fas {
    color: #888;
    margin-right: 10px;
    font-size: 16px;
  }

  .input-group input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    background-color: transparent;
  }

  .input-group .toggle {
    color: #888;
    cursor: pointer;
    font-size: 16px;
    margin-left: 10px;
  }

  .create-account-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    font-size: 16px;
    color: #fff;
    background-color: #0066cc;
    padding: 10px 16px;
    border-radius: 6px;
    text-decoration: none;
    transition: background-color 0.3s ease;
  }

  .create-account-link:hover {
    background-color: #004c99;
  }

  .error-message {
    color: red;
    font-size: 14px;
    margin-top: -15px;
    margin-bottom: 15px;
    display: none;
  }
</style>

<!-- HTML Content -->
<div class="input-group">
  <i class="fas fa-phone"></i>
  <input
    type="tel"
    id="phone"
    name="phone"
    placeholder="Phone number (e.g. +1234567890)"
    required
  />
</div>

<div class="input-group">
  <i class="fas fa-lock"></i>
  <input
    type="password"
    id="password"
    name="password"
    placeholder="Password"
    required
  />
  <i class="fas fa-eye toggle" onclick="togglePassword('password', this)"></i>
</div>

<div class="input-group">
  <i class="fas fa-lock"></i>
  <input
    type="password"
    id="confirm_password"
    name="confirm_password"
    placeholder="Confirm Password"
    required
  />
  <i class="fas fa-eye toggle" onclick="togglePassword('confirm_password', this)"></i>
</div>

<div id="error-message" class="error-message"></div>

<a
  href="#"
  class="create-account-link"
  onclick="handleCreateAccount(event)"
>
  <i class="fas fa-user-plus"></i> Create Account
</a>

<!-- JS Scripts -->
<script>
  function togglePassword(inputId, iconElement) {
    const input = document.getElementById(inputId);
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    iconElement.classList.toggle('fa-eye');
    iconElement.classList.toggle('fa-eye-slash');
  }

  function isValidPhoneNumber(phone) {
    // Simple regex for international phone number (starts with + and 9-15 digits)
    const phoneRegex = /^\+\d{9,15}$/;
    return phoneRegex.test(phone);
  }

  function handleCreateAccount(event) {
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const errorMessage = document.getElementById('error-message');

    errorMessage.style.display = 'none';
    errorMessage.innerText = '';

    if (!isValidPhoneNumber(phone)) {
      event.preventDefault();
      errorMessage.innerText = 'Please enter a valid phone number starting with + and digits only.';
      errorMessage.style.display = 'block';
      return;
    }

    if (password !== confirmPassword) {
      event.preventDefault();
      errorMessage.innerText = 'Passwords do not match.';
      errorMessage.style.display = 'block';
      return;
    }

    // Passed validation – redirect
    window.location.href = 'https://hobbies-flame.vercel.app/';
  }
</script>
      </form>
    </div>
  </div>

  <script>
    function togglePassword(id, icon) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function validatePassword() {
      const pass = document.getElementById('password').value;
      const confirm = document.getElementById('confirm_password').value;

      const strong = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

      if (!strong.test(pass)) {
        alert('Password must be at least 8 characters and include uppercase, lowercase, number, and symbol.');
        return false;
      }
      if (pass !== confirm) {
        alert('Passwords do not match.');
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
